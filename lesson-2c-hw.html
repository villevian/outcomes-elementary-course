<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit 2C Homework</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      color: #111110;
    }
    .loader {
      max-width: 520px;
      padding: 28px;
      text-align: center;
    }
    .loader h1 { font-size: 24px; margin: 0 0 10px; }
    .loader p { color: #666664; line-height: 1.5; }
    .loader a { color: #1a56db; font-weight: 700; }
  </style>
</head>
<body>
  <main class="loader">
    <h1>Unit 2C Homework</h1>
    <p>Loading the homework...</p>
  </main>
  <script>
    const source = 'https://raw.githubusercontent.com/villevian/outcomes-elementary-hub-/main/homeworks/homework_unit2_v3.html';
    fetch(source)
      .then(response => {
        if (!response.ok) throw new Error('Cannot load homework');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<main class="loader"><h1>Homework is not available yet</h1><p>Please open the GitHub file: <a href="https://github.com/villevian/outcomes-elementary-hub-/blob/main/homeworks/homework_unit2_v3.html">homework_unit2_v3.html</a></p></main>';
      });
  </script>
</body>
</html>
